name: build
on: [ pull_request, push ]

jobs:
  build:
    strategy:
      matrix:
        java: [ 17 ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - name: Loom Cache
        uses: actions/cache@v4
        with:
          path: "**/.gradle/loom-cache"
          key: "${{ runner.os }}-gradle-${{ hashFiles('**/libs.versions.*', '**/*.gradle*', '**/gradle-wrapper.properties') }}"
          restore-keys: "${{ runner.os }}-gradle-"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle Wrapper Integrity
        uses: gradle/wrapper-validation-action@v2

      - name: build
        run: ./gradlew build

      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

  # Publish a GitHub Release with the built jar whenever a tag (e.g. v0.2.0) is pushed.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: build/libs/

      - name: Drop sources jar
        # softprops/action-gh-release ignores negated glob patterns, so delete the
        # sources jar here and upload only the runnable mod jar.
        run: rm -f build/libs/*-sources.jar

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Create Sifter ${{ github.ref_name }}
          body: |
            **Create 机械动力：筛子（Fabric）** — 适配 Create 6.0.8.1 / Minecraft 1.20.1

            - 需要 Create Fabric >= 6.0.8.1 + Fabric API >= 0.92.11 + MC 1.20.1
            - 服务器与客户端使用同一份 jar
            - 详见 README 的兼容性与平衡性配置说明
          files: |
            build/libs/*.jar
          draft: false
          prerelease: false